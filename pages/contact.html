<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - NodeServe</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <nav>
        <a class="brand" href="/home">NodeServe</a>
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact" class="active">Contact</a>
        <a href="/services">Services</a>
    </nav>

    <div class="section">
        <h2>Get in touch</h2>
        <p>This is a sample contact page served by the Node.js server.</p>

        <div class="contact-grid">
            <form onsubmit="handleSubmit(event)">
                <div class="field">
                    <label>Name</label>
                    <input type="text" placeholder="Your name" required />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label>Subject</label>
                    <select>
                        <option>General Enquiry</option>
                        <option>Project Question</option>
                        <option>Feedback</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="contact-info">
                <h3>Contact details</h3>
                <div class="info-item">
                    <span class="ico">Email</span>
                    <p>student@example.com</p>
                </div>
                <div class="info-item">
                    <span class="ico">Place</span>
                    <p>Hyderabad, Telangana<br />India</p>
                </div>
                <div class="info-item">
                    <span class="ico">Time</span>
                    <p>Mon - Fri, 9am - 6pm IST</p>
                </div>
                <div class="info-item">
                    <span class="ico">Reply</span>
                    <p>This form is included for the frontend demo.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            alert('Message sent! This is a static demo with no backend connected.');
        }
    </script>

</body>

</html>
